name: Lockton
kind: company
description: >-
  Lockton Companies is the world's largest privately held, independent insurance
  brokerage, founded by Jack Lockton in 1966 and headquartered in Kansas City,
  Missouri, United States. Lockton is a broker and intermediary rather than a
  risk carrier: it places commercial property and casualty, specialty and
  financial lines, employee benefits and people solutions, private client
  coverage, and — through Lockton Re — treaty and facultative reinsurance, for
  tens of thousands of clients across a global network of associates and offices
  reaching more than 140 locations. Its API posture is honestly characterized as
  partner-gated with no public API surface. As of July 2026 Lockton publishes no
  developer portal, no API reference, no OpenAPI or Swagger definition, no
  GraphQL endpoint, no Postman workspace, and no webhook or event catalog. The
  hostnames developer.lockton.com, developers.lockton.com, docs.lockton.com and
  api.lockton.com do not resolve in DNS, and a crawl of the 6,953 URLs in
  global.lockton.com/sitemap.xml surfaces no developer, API, ACORD, IVANS,
  OpenAPI or Swagger path. Client-facing technology is delivered through
  authenticated regional Lockton Client Portals and the proprietary Lockton SAGE
  intelligence and analytics ecosystem, which is presented on the website behind
  a contact form with no self-serve access, no documented data feed and no
  published integration surface. This is the expected posture for a US
  broker-intermediary: the United States has no federal insurance regulator and
  no open-insurance mandate, so data exchange between carriers, brokers and
  agency management systems runs on ACORD standards in an EDI and forms idiom
  rather than a public API idiom. Lockton's most substantive standards signal is
  governance rather than implementation — in July 2026 Nidhi Howell, Chief
  Business Technology Officer of Lockton Re, was appointed to the ACORD Solutions
  Group Board of Directors representing the reinsurance broking channel — but no
  ACORD AL3, ACORD XML, NGDS or IVANS agency-download implementation is
  documented on any public Lockton property.
