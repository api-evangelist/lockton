      https://global.lockton.com/api/ return 404 anonymously.
  - url: https://global.lockton.com/sitemap.xml
    status: 200
    note: >-
      6,953 URLs enumerated. A case-insensitive scan for "develop", "/api",
      "integrat", "acord", "ivans", "swagger" and "openapi" returns only
      editorial content (property developers, business development, adverse
      development, ESG integration). ZERO developer, API reference, ACORD,
      IVANS or specification paths exist in the sitemap.
  - url: https://global.lockton.com/gb/en/client-login
    status: 200
