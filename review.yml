    status: 200
    note: >-
      Lockton SAGE Intelligence Platform. Contact-form-only. No API, no data
      feed, no integration documentation, no self-serve access.
  - url: https://github.com/Lockton-Companies
    status: 200
    note: >-
      Verified Lockton Companies GitHub organization (3 public repos:
      azure-enterprise-reports, terraform-provider-azurehelpers, and a fork of
      pnp-modern-search). All are internal IT/cloud-ops artifacts. No API
      specifications, SDKs or client libraries are published.
  - url: https://github.com/LocktonCompanies
    status: 200
    note: Second Lockton Companies GitHub organization, 0 public repositories.
  acordPosture:
    phrase: ACORD board seat via Lockton Re, no ACORD implementation documented
    detail: |
      Lockton's ACORD signal is governance, not implementation. On 20 July 2026
      Nidhi Howell, Chief Business Technology Officer of Lockton Re, was
      appointed to the ACORD Solutions Group Board of Directors, explicitly
      representing the reinsurance broking channel. Lockton Re also operates in
      the London/reinsurance orbit where Ruschlikon and ACORD ePlacing
      standards govern broker-to-carrier messaging. However, NO Lockton-owned
      public page documents an ACORD AL3, ACORD XML, NGDS, IVANS agency
      download, Applied Epic or Vertafore AMS360 integration. A full scan of
      the 6,953-URL sitemap returns no ACORD or IVANS reference at all.
    al3: not documented
    acordXml: not documented
    ngds: not documented
    ivansAgencyDownload: not documented
    agencyManagementSystemIntegration: not documented
    source: https://www.insurancebusinessmag.com/reinsurance/news/breaking-news/acord-appoints-four-to-board-with-new-chair-582927.aspx
  insuranceVerbs:
    quote: not exposed
    bind: not exposed
    issue: not exposed
    fnol: not exposed
    note: >-
      None of the four insurance API verbs are exposed programmatically. As a
      broker-intermediary Lockton does not underwrite; placement, binding and
      claims advocacy run through its brokers, carrier markets and
      authenticated Client Portals, not through a documented API.
  authModel:
    scheme: none public
    note: >-
      No public authentication scheme is documented because no public API
      exists. Client access is via authenticated regional Lockton Client
      Portals; the underlying scheme (SAML/OIDC to an enterprise IdP) is not
      published and no OIDC discovery document is served on global.lockton.com.
  webhooks:
    present: false
    asyncapi: false
    note: No event catalog, webhook documentation or AsyncAPI definition exists.
  postman:
    present: false
    note: No public Postman collection or workspace was found for Lockton.
  graphql:
    present: false
    note: https://global.lockton.com/graphql returns 404; no GraphQL surface to introspect.
  grpc:
    present: false
    note: No published .proto files.
  specs:
    harvested: 0
    note: >-
      Nothing to harvest. No candidate OpenAPI/Swagger URL returned a parsable
      specification; every probe returned 404 or an HTML document. The
      openapi/ directory is deliberately omitted from this repo.
  transports:
  - protocol: REST
    scheme: https
    documented: false
    note: No public REST API is documented.
  - protocol: GraphQL
    scheme: https
    documented: false
  - protocol: gRPC
    documented: false
  - protocol: WebSocket
    scheme: wss
    documented: false
  - protocol: ACORD/EDI
    documented: false
    note: >-
      Not documented publicly. Sector context is that broker-carrier exchange
      in the United States runs on ACORD AL3/XML moved by IVANS agency
      download between carriers and agency management systems; Lockton does not
      publish its own implementation of this plumbing.
  marketSeam: |
    The United States has no federal insurance regulator and no open-insurance
    mandate. Insurance is regulated state by state under NAIC model laws (the
    McCarran-Ferguson settlement), so there is no national API surface and
    nothing compels a broker or carrier to expose anything. Value has accrued
    to the software and risk-data layer sitting between carriers and
    distribution — Verisk, LexisNexis Risk, CCC, Guidewire, Duck Creek, Applied
    Systems, Vertafore/IVANS — while brokers and carriers themselves publish
    almost nothing public. Lockton is a textbook instance of that pattern.
