aid: lockton
name: Lockton
review:
  question: Does Lockton expose a public, self-serve developer portal or documented API surface?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United States
  tier: broker-intermediary
  gated: true
  openapiHarvested: false
  specsCount: 0
findings:
  summary: |
    Lockton Companies — the world's largest privately held independent
    insurance brokerage, founded 1966 in Kansas City, Missouri — publishes NO
    public API surface of any kind. There is no developer portal, no API
    reference, no downloadable OpenAPI/Swagger definition, no GraphQL
    endpoint, no published .proto, no public Postman collection or workspace,
    and no webhook or event catalog. The only integration surfaces Lockton
    exposes to the outside world are authenticated regional Client Portals and
    the contact-form-gated Lockton SAGE intelligence platform. Recording this
    absence accurately is the finding: it is the expected posture for a US
    broker-intermediary in a market with no federal insurance regulator and no
    open-insurance mandate.
  developerPortal:
    url: ''
    confirmed: false
    classification: none
    note: |
      No developer portal of any kind was found. Every canonical developer
      hostname fails to resolve in DNS (NXDOMAIN, no A record): the closest
      thing to a technology surface on the public website is a marketing page
      for the Lockton SAGE intelligence platform whose sole call to action is
      a contact form, plus regional Client Portal login pages.
