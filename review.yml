actions:
  status: built-stub
  apisListed: 0
  openapiDirectoryCreated: false
  reason: >-
    Identity captured honestly. Lockton has no public, self-serve API surface;
    every integration path is partner or client gated. apis[] is intentionally
    empty and the openapi/ directory is intentionally omitted rather than
    filled with anything fabricated.
